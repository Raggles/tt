<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #1a1b2e;
      --card: #16213e;
      --accent: #e94560;
      --accent2: #0f3460;
      --text: #eaeaea;
      --correct: #4ecca3;
      --wrong: #e94560;
    }

    body {
      font-family: 'Fredoka', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      margin-bottom: 0.5rem;
      color: var(--accent);
    }

    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 420px;
    }

    .screen.active {
      display: flex;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 1.5rem;
      width: 100%;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    label {
      display: block;
      margin-bottom: 0.25rem;
      font-size: 0.95rem;
    }

    input[type="number"],
    select {
      width: 100%;
      padding: 0.6rem;
      font-size: 1.1rem;
      border: 2px solid var(--accent2);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      margin-bottom: 1rem;
    }

    input[type="number"]:focus,
    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      font-size: 1.1rem;
      font-family: inherit;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(233, 69, 96, 0.4);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      width: 100%;
      margin-top: 0.5rem;
    }

    .btn-ghost {
      background: transparent;
      color: var(--accent);
      border: 2px solid var(--accent);
      margin-top: 0.5rem;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .level-btn {
      padding: 0.9rem;
      font-size: 1rem;
      background: var(--accent2);
      color: var(--text);
      border: 2px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }

    .level-btn:hover {
      border-color: var(--accent);
      background: #1a2a4a;
    }

    .level-btn.unlocked {
      background: var(--accent2);
    }

    .level-btn.locked {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .level-btn.selected {
      border-color: var(--accent);
      background: rgba(233, 69, 96, 0.2);
    }

    .timer-bar {
      height: 8px;
      background: var(--accent2);
      border-radius: 4px;
      overflow: hidden;
      width: 100%;
      margin-bottom: 1rem;
    }

    .timer-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--correct), var(--accent));
      transition: width 0.5s linear;
    }

    .equation-display {
      font-size: clamp(2rem, 8vw, 3.5rem);
      text-align: center;
      margin: 1.5rem 0;
      letter-spacing: 0.05em;
      min-height: 4rem;
    }

    .equation-display input {
      width: 4rem;
      font-size: inherit;
      font-family: inherit;
      text-align: center;
      background: var(--bg);
      border: 3px solid var(--accent2);
      border-radius: 8px;
      color: var(--text);
      padding: 0.2rem;
    }

    .equation-display input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .score-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .feedback {
      min-height: 2rem;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    .feedback.correct { color: var(--correct); }
    .feedback.wrong { color: var(--wrong); }

    .results-card {
      text-align: center;
    }

    .results-card h2 {
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .results-card .final-score {
      font-size: 2.5rem;
      color: var(--correct);
      margin: 0.5rem 0;
    }

    .results-card .level-badge {
      display: inline-block;
      background: var(--accent2);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      margin: 0.5rem 0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>Math</h1>

  <div id="menu-screen" class="screen active">
    <div class="card">
      <label for="game-time">Time per round (seconds)</label>
      <input type="number" id="game-time" min="10" max="120" value="30">
      <p style="margin-bottom: 1rem; font-size: 0.9rem; opacity: 0.9;">Play a level or beat them in order.</p>
      <button type="button" class="btn btn-primary" id="btn-play-sequence">Play levels in order (1 → 9)</button>
      <button type="button" class="btn btn-ghost" id="btn-choose-level">Choose a level</button>
    </div>
  </div>

  <div id="level-screen" class="screen">
    <div class="card">
      <label>Select level</label>
      <div class="level-grid" id="level-grid"></div>
      <button type="button" class="btn btn-primary" id="btn-start-level">Start level</button>
      <button type="button" class="btn btn-ghost" id="btn-back-menu">Back</button>
    </div>
  </div>

  <div id="game-screen" class="screen">
    <div class="card" style="width: 100%;">
      <div class="score-line">
        <span>Level <span id="current-level-num">1</span></span>
        <span>Score: <span id="score">0</span></span>
        <span id="time-left">0:30</span>
      </div>
      <div class="timer-bar">
        <div class="timer-fill" id="timer-fill" style="width: 100%"></div>
      </div>
      <div class="equation-display" id="equation-display"></div>
      <label for="answer-input">Your answer</label>
      <input type="number" id="answer-input" placeholder="?" autocomplete="off">
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <div id="results-screen" class="screen">
    <div class="card results-card">
      <h2>Time's up!</h2>
      <p class="final-score" id="final-score">0</p>
      <p>equations solved</p>
      <span class="level-badge" id="result-level-badge">Level 1</span>
      <div style="margin-top: 1.5rem;">
        <button type="button" class="btn btn-primary" id="btn-play-again">Play again</button>
        <button type="button" class="btn btn-primary" id="btn-next-level" style="display: none;">Next level</button>
        <button type="button" class="btn btn-ghost" id="btn-results-menu">Menu</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const LEVELS = [
        { id: 1, name: 'Level 1', desc: 'Add & subtract (single digits)' },
        { id: 2, name: 'Level 2', desc: 'Add & subtract, same tens' },
        { id: 3, name: 'Level 3', desc: 'Add & subtract, cross tens' },
        { id: 4, name: 'Level 4', desc: '+ ×2, ×5, ×10 (to 10)' },
        { id: 5, name: 'Level 5', desc: '+ ÷2, ÷5, ÷10' },
        { id: 6, name: 'Level 6', desc: 'All times tables to 12' },
        { id: 7, name: 'Level 7', desc: 'All tables + division to 12' },
        { id: 8, name: 'Level 8', desc: '+ two-digit addition' },
        { id: 9, name: 'Level 9', desc: '+ two-digit subtraction' }
      ];

      let state = {
        timeLimit: 30,
        level: 1,
        score: 0,
        timerId: null,
        startTime: 0,
        currentEquation: null,
        playSequence: false
      };

      function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function pick(arr) {
        return arr[randInt(0, arr.length - 1)];
      }

      function generateEquation(level) {
        if (level === 1) return genAddSubSingleDigit();
        if (level === 2) return genAddSubSameTens();
        if (level === 3) return genAddSubCrossTens();
        if (level === 4) return genLevel4();
        if (level === 5) return genLevel5();
        if (level === 6) return genLevel6();
        if (level === 7) return genLevel7();
        if (level === 8) return genLevel8();
        if (level === 9) return genLevel9();
        return genAddSubSingleDigit();
      }

      function genAddSubSingleDigit() {
        const op = pick(['+', '-']);
        let a = randInt(0, 9);
        let b = randInt(0, 9);
        if (op === '-') {
          if (a < b) [a, b] = [b, a];
        }
        const result = op === '+' ? a + b : a - b;
        return placeBlank([a, op, b, '=', result], [0, 2, 4]);
      }

      function genAddSubSameTens() {
        var tens = randInt(1, 9);
        var low = tens * 10;
        var high = low + 9;
        var op = pick(['+', '-']);
        var twoDigit = randInt(low, high);
        var single, result, a, b;
        if (op === '+') {
          single = randInt(Math.max(0, low - twoDigit), Math.min(9, high - twoDigit));
          if (single < 0 || single > 9) return genAddSubSameTens();
          result = twoDigit + single;
          a = pick([true, false]) ? twoDigit : single;
          b = a === twoDigit ? single : twoDigit;
        } else {
          result = randInt(Math.max(low, twoDigit - 9), Math.min(high, twoDigit));
          single = twoDigit - result;
          a = twoDigit;
          b = single;
        }
        return placeBlank([a, op, b, '=', result], [0, 2, 4]);
      }

      function genAddSubCrossTens() {
        const op = pick(['+', '-']);
        let a, b, result;
        if (op === '+') {
          a = randInt(1, 8);
          b = randInt(10 - a, 9);
          result = a + b;
        } else {
          a = randInt(10, 18);
          b = randInt(a - 9, 9);
          if (b < 0) b = 0;
          result = a - b;
        }
        return placeBlank([a, op, b, '=', result], [0, 2, 4]);
      }

      function genLevel4() {
        if (pick([true, false])) return genAddSubCrossTens();
        const tables = [2, 5, 10];
        const t = pick(tables);
        const n = randInt(1, 10);
        const result = t * n;
        return placeBlank([t, '×', n, '=', result], [0, 2, 4]);
      }

      function genLevel5() {
        if (pick([true, true, false])) return genLevel4();
        const tables = [2, 5, 10];
        const t = pick(tables);
        const n = randInt(1, 10);
        const result = t * n;
        return placeBlank([result, '÷', t, '=', n], [0, 2, 4]);
      }

      function genLevel6() {
        if (pick([true, false])) return genLevel5();
        const t = randInt(1, 12);
        const n = randInt(1, 12);
        const result = t * n;
        return placeBlank([t, '×', n, '=', result], [0, 2, 4]);
      }

      function genLevel7() {
        if (pick([true, false])) return genLevel6();
        const t = randInt(1, 12);
        const n = randInt(1, 12);
        const result = t * n;
        return placeBlank([result, '÷', t, '=', n], [0, 2, 4]);
      }

      function genLevel8() {
        if (pick([true, false])) return genLevel7();
        const a = randInt(10, 99);
        const b = randInt(10, 99);
        const result = a + b;
        if (result > 99) return genLevel8();
        return placeBlank([a, '+', b, '=', result], [0, 2, 4]);
      }

      function genLevel9() {
        if (pick([true, false])) return genLevel8();
        const a = randInt(10, 99);
        const b = randInt(10, 99);
        if (a < b) [a, b] = [b, a];
        const result = a - b;
        return placeBlank([a, '-', b, '=', result], [0, 2, 4]);
      }

      function placeBlank(parts, slotIndices) {
        var slot = pick(slotIndices);
        var display = parts.slice();
        display[slot] = '_';
        return { display: display, answer: parts[slot], slot: slot };
      }

      function showScreen(id) {
        document.querySelectorAll('.screen').forEach(function (el) { el.classList.remove('active'); });
        var el = document.getElementById(id);
        if (el) el.classList.add('active');
      }

      function renderLevelSelect() {
        var grid = document.getElementById('level-grid');
        grid.innerHTML = '';
        LEVELS.forEach(function (lvl) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'level-btn' + (state.level === lvl.id ? ' selected' : '');
          btn.textContent = lvl.id;
          btn.title = lvl.desc;
          btn.addEventListener('click', function () {
            state.level = lvl.id;
            document.querySelectorAll('.level-btn').forEach(function (b) { b.classList.remove('selected'); });
            btn.classList.add('selected');
          });
          grid.appendChild(btn);
        });
      }

      function buildEquationDOM(eq) {
        var container = document.getElementById('equation-display');
        container.innerHTML = '';
        eq.display.forEach(function (part) {
          var span = document.createElement('span');
          span.textContent = part === '_' ? ' _ ' : ' ' + part + ' ';
          container.appendChild(span);
        });
      }

      function showEquation(eq) {
        state.currentEquation = eq;
        buildEquationDOM(eq);
        var answerInput = document.getElementById('answer-input');
        if (answerInput) {
          answerInput.value = '';
          answerInput.focus();
        }
        document.getElementById('feedback').textContent = '';
        document.getElementById('feedback').className = 'feedback';
      }

      function submitAnswer() {
        var eq = state.currentEquation;
        if (!eq) return;
        var value = (document.getElementById('answer-input').value || '').trim();
        var num = parseInt(value, 10);
        if (isNaN(num)) {
          document.getElementById('feedback').textContent = 'Enter a number!';
          document.getElementById('feedback').className = 'feedback wrong';
          return;
        }
        if (num === eq.answer) {
          state.score++;
          document.getElementById('score').textContent = state.score;
          document.getElementById('feedback').textContent = 'Correct!';
          document.getElementById('feedback').className = 'feedback correct';
          setTimeout(function () {
            showEquation(generateEquation(state.level));
          }, 400);
        } else {
          document.getElementById('feedback').textContent = 'Try again! Answer: ' + eq.answer;
          document.getElementById('feedback').className = 'feedback wrong';
        }
      }

      function tick() {
        var elapsed = (Date.now() - state.startTime) / 1000;
        var left = Math.max(0, state.timeLimit - elapsed);
        var pct = (left / state.timeLimit) * 100;
        document.getElementById('timer-fill').style.width = pct + '%';
        var sec = Math.ceil(left);
        document.getElementById('time-left').textContent = '0:' + (sec < 10 ? '0' : '') + sec;
        if (left <= 0) {
          endGame();
        }
      }

      function startGame(level) {
        state.level = level;
        state.score = 0;
        state.startTime = Date.now();
        showScreen('game-screen');
        document.getElementById('current-level-num').textContent = state.level;
        document.getElementById('score').textContent = '0';
        document.getElementById('timer-fill').style.width = '100%';
        document.getElementById('time-left').textContent = '0:' + (state.timeLimit < 10 ? '0' : '') + state.timeLimit;
        showEquation(generateEquation(state.level));
        if (state.timerId) clearInterval(state.timerId);
        state.timerId = setInterval(tick, 200);
      }

      function endGame() {
        if (state.timerId) {
          clearInterval(state.timerId);
          state.timerId = null;
        }
        showScreen('results-screen');
        document.getElementById('final-score').textContent = state.score;
        document.getElementById('result-level-badge').textContent = 'Level ' + state.level;
        var nextBtn = document.getElementById('btn-next-level');
        if (state.playSequence && state.level < 9) {
          nextBtn.style.display = 'inline-block';
        } else {
          nextBtn.style.display = 'none';
        }
      }

      function playAgain() {
        startGame(state.level);
      }

      document.getElementById('game-time').addEventListener('change', function () {
        var n = parseInt(this.value, 10);
        if (n >= 10 && n <= 120) state.timeLimit = n;
      });

      document.getElementById('btn-play-sequence').addEventListener('click', function () {
        state.timeLimit = parseInt(document.getElementById('game-time').value, 10) || 30;
        state.timeLimit = Math.max(10, Math.min(120, state.timeLimit));
        state.playSequence = true;
        state.level = 1;
        startGame(1);
      });

      document.getElementById('btn-choose-level').addEventListener('click', function () {
        state.playSequence = false;
        state.timeLimit = parseInt(document.getElementById('game-time').value, 10) || 30;
        state.timeLimit = Math.max(10, Math.min(120, state.timeLimit));
        renderLevelSelect();
        showScreen('level-screen');
      });

      document.getElementById('btn-back-menu').addEventListener('click', function () {
        showScreen('menu-screen');
      });

      document.getElementById('btn-start-level').addEventListener('click', function () {
        startGame(state.level);
      });

      document.getElementById('btn-play-again').addEventListener('click', playAgain);
      document.getElementById('btn-next-level').addEventListener('click', function () {
        if (state.level < 9) {
          state.level++;
          startGame(state.level);
        }
      });
      document.getElementById('btn-results-menu').addEventListener('click', function () {
        showScreen('menu-screen');
      });

      document.getElementById('answer-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') submitAnswer();
      });
    })();
  </script>
</body>
</html>
