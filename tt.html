<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Times Table Triangle Game</title>
  <style>
    body {
      background: #222;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      margin: 0;
    }
    #settings {
      margin-bottom: 10px;
    }
    #grid {
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      margin-top: 20px;
    }
    .row {
      display: flex;
    }
    .triangle {
      width: 60px;
      height: 60px;
      background: #444;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4px;
      box-sizing: border-box;
      align-items: center;
      margin: 2px;

      font-weight: bold;
      transition: transform 0.2s, background-color 0.2s;
      color: white;
      font-size: 12px;
      text-align: center;
    }
    .triangle .top {
      padding-top:20px;
      font-size: 14px;
      font-weight: bold;
    }
    .highlighted {
      background: #fff !important;
      color: #000;
      transform: scale(1.5);
    }
    .correct {
      background-color: #494949 !important;
      color: #fff;
    }
    #status {
      margin-top: 10px;
      font-size: 20px;
    }
    #message {
      margin-top: 20px;
      font-size: 28px;
      font-weight: bold;
    }
    #restart {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="settings">
    Hearts: <input id="heartInput" type="number" min="1" max="10" value="5">
    Time (s): <input id="timeInput" type="number" min="30" max="600" value="180">
    Max Table: <input id="maxTableInput" type="number" min="5" max="12" value="9">
    <button onclick="startGame()">Start Game</button>
  </div>
  <div id="status"></div>
  <div id="grid"></div>
  <div id="message"></div>
  <button id="restart" onclick="window.location.reload()">Start Again</button>
  <audio id="correctSound" src="https://raggles.github.io/tt/wohoo.ogg"></audio>
  <audio id="wrongSound" src="https://raggles.github.io/tt/fart.ogg"></audio>
  <audio id="gameOverSound" src="https://raggles.github.io/tt/gameover.ogg"></audio>
  <script>
    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    const message = document.getElementById("message");
    const correctSound = document.getElementById("correctSound");
    const wrongSound = document.getElementById("wrongSound");
    const gameOverSound = document.getElementById("gameOverSound");

    let hearts = 5;
    let time = 180;
    let maxTable = 9;
    let timerStarted = false;
    let current;
    let timer;
    let triangles = [];

    const colors = {
      2: '#e74c3c', 3: '#e67e22', 4: '#f1c40f', 5: '#2ecc71',
      6: '#1abc9c', 7: '#3498db', 8: '#9b59b6', 9: '#fd79a8',
      10: '#e84393', 11: '#6c5ce7', 12: '#00cec9'
    };

    function buildGrid() {
      grid.innerHTML = "";
      triangles = [];
      for (let i = 2; i <= maxTable; i++) {
        const row = document.createElement("div");
        row.className = "row";
        for (let j = i; j <= maxTable; j++) {
          const div = document.createElement("div");
          div.className = "triangle";
          div.style.background = colors[i] || '#666';
          div.dataset.eq = `${i}×${j}`;
          div.dataset.answer = i * j;
          div.innerHTML = `<div class="top"></div><div class="bottom">${i}×${j}</div>`;
          row.appendChild(div);
          triangles.push(div);
        }
        grid.appendChild(row);
      }
    }
    
    function startTimer() {
      timer = setInterval(() => {
        time--;
        updateStatus();
        if (time <= 0) {
          gameOver("Time's up!", false);
        }
      }, 1000);
    }

    function updateStatus(remaining = time) {
      const heartsStr = '❤️'.repeat(hearts);
      status.textContent = `Hearts: ${heartsStr} | Time: ${remaining}s`;
    }

    function gameOver(msg, won) {
      clearInterval(timer);
      message.textContent = msg;
      if (!won)
        gameOverSound.play();
    }

    function pickNext() {
      if (triangles.every(t => t.classList.contains("correct"))) {
        gameOver("You win!", true);
        return;
      }
      if (current) current.classList.remove("highlighted");
      const unfilled = triangles.filter(t => !t.classList.contains("correct"));
      current = unfilled[Math.floor(Math.random() * unfilled.length)];
      current.classList.add("highlighted");
    }

    document.addEventListener("keydown", e => {
      if (!current) return;
      

      if (e.key.length === 1 && !isNaN(e.key)) {
        current.input = (current.input || "") + e.key;
      } else if (e.key === "Backspace") {
        current.input = (current.input || "").slice(0, -1);
      } else if (e.key === "Enter") {
        if (!timerStarted) {
          timerStarted = true;
          startTimer();
        }
        if (parseInt(current.input) === parseInt(current.dataset.answer)) {
          correctSound.currentTime = 0;
          correctSound.play();
          const topDiv = current.querySelector(".top");
          topDiv.textContent = current.dataset.answer;
          current.classList.remove("highlighted");
          current.classList.add("correct");
          current.input = "";
          pickNext();
        } else {
          wrongSound.currentTime = 0;
          wrongSound.play();
          hearts--;
          updateStatus();
          if (hearts <= 0) gameOver("Out of hearts!", false);
          current.input = "";
        }
      }
    });

    function startGame() {
      clearInterval(timer);
      hearts = parseInt(document.getElementById("heartInput").value);
      time = parseInt(document.getElementById("timeInput").value);
      maxTable = parseInt(document.getElementById("maxTableInput").value);
      timerStarted = false;
      current = null;
      message.textContent = "";
      buildGrid();
      updateStatus();
      pickNext();
      document.activeElement.blur()
    }
  </script>
</body>
</html>
